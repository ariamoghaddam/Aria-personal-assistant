name: Build & Upload Mana iOS TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mana-native
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild App.tsx
        run: cat App.part1 App.part2 App.part3 App.part4 > App.tsx
      - name: Install JS dependencies
        run: npm install
      - name: Install Expo native modules
        run: npx expo install expo-constants expo-device expo-image-picker expo-location expo-notifications expo-task-manager @react-native-async-storage/async-storage react-native-safe-area-context
      - name: Normalize Expo dependency versions
        run: npx expo install --fix
      - name: Prebuild iOS
        env:
          CI: '1'
        run: npx expo prebuild --platform ios --no-install
      - name: CocoaPods
        run: |
          cd ios
          pod install --repo-update
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mana-native
      - name: Validate Apple secrets
        run: |
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_P8_BASE64"
          test -n "$APPLE_TEAM_ID"
      - name: Build signed IPA and upload to TestFlight
        run: bundle exec fastlane ios testflight
      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mana-iOS-IPA
          path: mana-native/dist/Mana.ipa
          retention-days: 7
