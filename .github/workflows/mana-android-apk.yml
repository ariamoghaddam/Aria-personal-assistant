name: Build Mana Android APK

on:
  push:
    branches: [mana-native-build]
    paths:
      - 'mana-native/**'
      - '.github/workflows/mana-android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mana-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mana-native/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Rebuild App.tsx
        run: cat App.part1 App.part2 App.part3 App.part4 > App.tsx

      - name: Install base dependencies
        run: npm install

      - name: Install Expo native modules compatible with SDK 57
        run: npx expo install expo-constants expo-device expo-image-picker expo-linking expo-location expo-notifications expo-status-bar expo-task-manager @react-native-async-storage/async-storage react-native-safe-area-context

      - name: Normalize Expo dependency versions
        run: npx expo install --fix

      - name: Expo doctor
        run: npx expo-doctor || true

      - name: Prebuild Android
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare artifact
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Mana-Android.apk
          ls -lh Mana-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mana-Android-APK
          path: mana-native/Mana-Android.apk
          if-no-files-found: error
          retention-days: 7
